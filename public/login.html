<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - Roblox Wiki</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
  <div class="bg-slate-800 p-8 rounded-lg border border-slate-700 max-w-md w-full shadow-lg">
    <h2 id="form-title" class="text-2xl font-bold text-center mb-6">เข้าสู่ระบบ</h2>

    <form id="auth-form" onsubmit="handleSubmit(event)" class="space-y-4">
      <div id="username-field" class="hidden">
        <label class="block text-sm font-medium mb-1">ชื่อผู้ใช้ (Username)</label>
        <input type="text" id="username" class="w-full p-2.5 rounded bg-slate-900 border border-slate-700 focus:outline-none focus:border-red-500">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">อีเมล (Email)</label>
        <input type="email" id="email" required class="w-full p-2.5 rounded bg-slate-900 border border-slate-700 focus:outline-none focus:border-red-500">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">รหัสผ่าน (Password)</label>
        <input type="password" id="password" required class="w-full p-2.5 rounded bg-slate-900 border border-slate-700 focus:outline-none focus:border-red-500">
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-red-600 hover:bg-red-700 py-2.5 rounded font-bold transition">เข้าสู่ระบบ</button>
    </form>

    <div class="mt-4 text-center text-sm">
      <button onclick="toggleMode()" id="toggle-btn" class="text-red-400 hover:underline">ยังไม่มีบัญชี? สมัครสมาชิกที่นี่</button>
    </div>
  </div>

  <script>
    let isLogin = true;

    function toggleMode() {
      isLogin = !isLogin;
      document.getElementById('form-title').innerText = isLogin ? 'เข้าสู่ระบบ' : 'สมัครสมาชิก';
      document.getElementById('submit-btn').innerText = isLogin ? 'เข้าสู่ระบบ' : 'สมัครสมาชิก';
      document.getElementById('username-field').classList.toggle('hidden', isLogin);
      document.getElementById('toggle-btn').innerText = isLogin ? 'ยังไม่มีบัญชี? สมัครสมาชิกที่นี่' : 'มีบัญชีอยู่แล้ว? เข้าสู่ระบบที่นี่';
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const username = document.getElementById('username').value;

      const endpoint = isLogin ? '/api/auth/login' : '/api/auth/register';
      const payload = isLogin ? { email, password } : { username, email, password };

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      if (res.ok) {
        if (isLogin) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = '/';
        } else {
          alert('สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ');
          toggleMode();
        }
      } else {
        alert(data.message || 'เกิดข้อผิดพลาด');
      }
    }
  </script>
</body>
</html>
