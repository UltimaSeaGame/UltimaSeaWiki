<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Roblox Wiki</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-8">
  <div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold">Admin Dashboard</h1>
      <a href="/" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded">กลับหน้าหลัก</a>
    </div>

    <!-- Form เพิ่มบทความ -->
    <div class="bg-slate-800 p-6 rounded-lg border border-slate-700 mb-8">
      <h2 class="text-xl font-bold mb-4 text-red-400">สร้างบทความ / ไอเทมใหม่</h2>
      <form onsubmit="createArticle(event)" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm mb-1">ชื่อบทความ / ไอเทม</label>
            <input type="text" id="title" required class="w-full p-2 rounded bg-slate-900 border border-slate-700">
          </div>
          <div>
            <label class="block text-sm mb-1">URL Slug (เช่น shadow-blade)</label>
            <input type="text" id="slug" required class="w-full p-2 rounded bg-slate-900 border border-slate-700">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm mb-1">หมวดหมู่</label>
            <select id="category" class="w-full p-2 rounded bg-slate-900 border border-slate-700">
              <option value="Items">Items</option>
              <option value="Characters">Characters</option>
              <option value="Weapons">Weapons</option>
              <option value="Skills">Skills</option>
              <option value="Maps">Maps</option>
              <option value="Guides">Guides</option>
            </select>
          </div>
          <div>
            <label class="block text-sm mb-1">ระดับความหายาก</label>
            <select id="rarity" class="w-full p-2 rounded bg-slate-900 border border-slate-700">
              <option value="Common">Common</option>
              <option value="Uncommon">Uncommon</option>
              <option value="Rare">Rare</option>
              <option value="Epic">Epic</option>
              <option value="Legendary">Legendary</option>
              <option value="Mythic">Mythic</option>
              <option value="Secret">Secret</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-sm mb-1">เนื้อหาบทความ</label>
          <textarea id="content" rows="4" required class="w-full p-2 rounded bg-slate-900 border border-slate-700"></textarea>
        </div>

        <button type="submit" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded font-bold">บันทึกบทความ</button>
      </form>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      alert('กรุณาเข้าสู่ระบบ');
      window.location.href = '/login.html';
    }

    async function createArticle(e) {
      e.preventDefault();
      const payload = {
        title: document.getElementById('title').value,
        slug: document.getElementById('slug').value,
        category: document.getElementById('category').value,
        rarity: document.getElementById('rarity').value,
        content: document.getElementById('content').value,
        status: 'Published'
      };

      const res = await fetch('/api/articles', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        alert('สร้างบทความเรียบร้อย!');
        window.location.href = '/';
      } else {
        const err = await res.json();
        alert('เกิดข้อผิดพลาด: ' + err.message);
      }
    }
  </script>
</body>
</html>
